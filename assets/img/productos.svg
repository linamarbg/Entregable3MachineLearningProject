  <!-- cebolla -->
  <g transform="translate(900 50)">
    <path d="M0 -30 C 4 -20 22 -12 22 6 C 22 22 10 30 0 30 C -10 30 -22 22 -22 6 C -22 -12 -4 -20 0 -30 Z" fill="#b5536f"/>
