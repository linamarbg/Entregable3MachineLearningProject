<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 84" role="img" aria-labelledby="pr-t">
  <title id="pr-t">Alimentos que llegan a las centrales mayoristas: tomate, plátano, papa, aguacate, zanahoria, mazorca, naranja y cebolla</title>
  <!-- tomate -->
  <g transform="translate(60 46)">
    <circle r="24" fill="#c8423b"/>
    <ellipse cx="-8" cy="-8" rx="6" ry="4" fill="#ffffff" opacity=".35"/>
    <path d="M0 -24 L5 -32 L4 -22 L13 -27 L6 -19 L16 -18 L5 -15 L0 -10 L-5 -15 L-16 -18 L-6 -19 L-13 -27 L-4 -22 L-5 -32 Z" fill="#3d7f52"/>
  </g>
  <!-- plátano -->
  <g transform="translate(180 46)">
    <path d="M-26 -6 C -18 18 18 24 30 4 C 16 12 -6 8 -18 -12 Z" fill="#f2c94c" stroke="#d6a92f" stroke-width="2"/>
    <path d="M-22 -16 C -10 6 20 10 30 -8 C 16 -2 -4 -6 -14 -22 Z" fill="#f5d46a" stroke="#d6a92f" stroke-width="2"/>
    <path d="M-20 -20 L-26 -30 L-14 -24 Z" fill="#6b4f2f"/>
  </g>
  <!-- papa -->
  <g transform="translate(300 48)">
