  </g>
  <!-- aguacate -->
  <g transform="translate(420 46) rotate(-18)">
    <path d="M0 -30 C 14 -30 22 -8 24 8 C 26 24 12 32 0 32 C -12 32 -26 24 -24 8 C -22 -8 -14 -30 0 -30 Z" fill="#3f6e2a"/>
    <path d="M0 -22 C 10 -22 16 -4 18 8 C 19 20 9 26 0 26 C -9 26 -19 20 -18 8 C -16 -4 -10 -22 0 -22 Z" fill="#c4d86f"/>
    <circle cx="0" cy="10" r="10" fill="#8a5a3c"/>
    <circle cx="-3" cy="6" r="3" fill="#ffffff" opacity=".3"/>
  </g>
  <!-- zanahoria -->
  <g transform="translate(540 50) rotate(30)">
    <path d="M-10 -16 L10 -16 L2 32 Q 0 36 -2 32 Z" fill="#ef8a2b"/>
    <g stroke="#c96a16" stroke-width="2" stroke-linecap="round"><line x1="-6" y1="-6" x2="0" y2="-6"/><line x1="2" y1="4" x2="6" y2="4"/><line x1="-4" y1="14" x2="1" y2="14"/></g>
    <path d="M0 -16 C -12 -30 -8 -36 -2 -40 C 0 -32 0 -24 0 -16 Z M0 -16 C 10 -30 16 -32 20 -30 C 12 -26 6 -20 0 -16 Z M0 -16 C -4 -28 2 -38 8 -40 C 6 -30 4 -22 0 -16 Z" fill="#4e9a3a"/>
  </g>
  <!-- mazorca -->
  <g transform="translate(660 46) rotate(-25)">
    <ellipse rx="13" ry="30" fill="#f2c94c"/>
    <g fill="#e3b23c">
      <circle cx="-5" cy="-18" r="2.6"/><circle cx="5" cy="-18" r="2.6"/><circle cx="-6" cy="-8" r="2.6"/><circle cx="6" cy="-8" r="2.6"/>
      <circle cx="-6" cy="2" r="2.6"/><circle cx="6" cy="2" r="2.6"/><circle cx="-5" cy="12" r="2.6"/><circle cx="5" cy="12" r="2.6"/><circle cx="0" cy="22" r="2.6"/>
    </g>
    <path d="M-2 30 C -24 14 -22 -14 -14 -26 C -14 -6 -10 14 2 30 Z" fill="#5fae45"/>
    <path d="M2 30 C 24 14 22 -14 14 -26 C 14 -6 10 14 -2 30 Z" fill="#4e9a3a"/>
