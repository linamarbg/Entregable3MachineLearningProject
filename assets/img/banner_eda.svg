<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-labelledby="be-t be-d">
  <title id="be-t">Explorar los datos de abastecimiento</title>
  <desc id="be-d">Ilustración propia: una lupa revisa barras y una serie semanal dibujadas sobre surcos de cultivo y guacales de alimentos.</desc>
  <defs>
    <linearGradient id="be-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf1d6"/><stop offset="1" stop-color="#e8f1e4"/>
    </linearGradient>
    <clipPath id="be-marco"><rect width="520" height="220" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#be-marco)">
    <rect width="520" height="220" fill="url(#be-fondo)"/>
    <!-- surcos -->
    <path d="M0 170 Q 260 130 520 170 L520 220 L0 220 Z" fill="#5f9e6e"/>
    <g fill="none" stroke="#3d7f52" stroke-width="3" stroke-linecap="round">
      <path d="M20 196 Q 260 160 500 196"/><path d="M40 212 Q 260 178 480 212"/><path d="M10 182 Q 260 146 510 182"/>
    </g>
    <!-- panel con barras -->
    <rect x="40" y="26" width="270" height="130" rx="12" fill="#ffffff" stroke="#e1dccd" stroke-width="2"/>
    <g fill="#7c858d" opacity=".55">
      <rect x="64" y="96" width="22" height="44" rx="3"/><rect x="134" y="88" width="22" height="52" rx="3"/><rect x="204" y="100" width="22" height="40" rx="3"/>
    </g>
    <g fill="#c8423b">
      <rect x="90" y="108" width="22" height="32" rx="3"/><rect x="160" y="70" width="22" height="70" rx="3"/><rect x="230" y="114" width="22" height="26" rx="3"/>
    </g>
    <polyline points="60,70 92,58 124,64 156,40 188,52 220,46 252,60 284,50" fill="none" stroke="#2b6f8e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#2b6f8e"><circle cx="156" cy="40" r="4"/><circle cx="284" cy="50" r="4"/></g>
    <line x1="56" y1="140" x2="292" y2="140" stroke="#cfc8b6" stroke-width="2"/>
    <!-- lupa -->
    <g transform="translate(330 70)">
      <circle r="44" fill="#ffffff" fill-opacity=".55" stroke="#1f5135" stroke-width="9"/>
      <path d="M30 32 L64 66" stroke="#1f5135" stroke-width="14" stroke-linecap="round"/>
      <path d="M-24 10 L-10 -6 L4 4 L22 -18" fill="none" stroke="#e39b2d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- guacales -->
    <g transform="translate(410 128)">
      <rect x="0" y="10" width="44" height="28" rx="3" fill="#c98b4e"/>
      <line x1="0" y1="24" x2="44" y2="24" stroke="#a86d38" stroke-width="2"/>
      <g fill="#c8423b"><circle cx="9" cy="8" r="7"/><circle cx="22" cy="6" r="7"/><circle cx="35" cy="8" r="7"/></g>
      <rect x="50" y="18" width="40" height="22" rx="3" fill="#d39a5c"/>
      <g fill="#3f6e2a"><ellipse cx="60" cy="14" rx="6" ry="7"/><ellipse cx="74" cy="13" rx="6" ry="7"/></g>
      <ellipse cx="85" cy="16" rx="5" ry="4" fill="#b8875a"/>
    </g>
  </g>
</svg>
